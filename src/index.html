<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOS Tracker</title>

  <!-- Fonts (external CDN — see docs/MIGRATION_REPORT.md) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">

  <!-- Styles (load order matters: base → layout → components → pages → responsive) -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <!-- App root — all views are rendered here by js/ui.js -->
  <div id="app" class="mos light"></div>

  <!-- Hidden input used by the Import backup button -->
  <input id="import-file" type="file" accept="application/json,.json" hidden>

  <!-- Icons (external CDN — Lucide). Loaded before the app module. -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Application (ES modules; must be served over http, not file://) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
